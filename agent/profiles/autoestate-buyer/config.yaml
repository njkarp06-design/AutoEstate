# AutoEstate — BUYER-FACING instance (dev).
# This profile is the first untrusted-input surface in the product: strangers
# message it directly. Everything below exists to make it safe by construction
# rather than by heuristic. Do not relax any of it without re-reading
# CLAUDE.md's buyer-inquiry section.
model:
  default: anthropic/claude-opus-4.6
  provider: anthropic

# --- Skill isolation -------------------------------------------------------
# ONLY the buyer skill. Deliberately NOT the operator's agent/skills dir,
# which holds the five outbound, Listing-table-mutating skills. A stranger
# must never be able to route to just-sold / listing-status-update / etc.
skills:
  # MACHINE-SPECIFIC - change per deployment. An absolute path on the dev
  # laptop. On a Linux instance it resolves to nothing, and the failure is
  # silent and total: the profile discovers ZERO skills, leaving a public
  # receptionist with no receptionist. Terraform's future per-customer buyer
  # instance ships from this file, so this must be set to the deployed
  # skills-buyer path. Tracked as a deploy gate in TODO.md.
  external_dirs:
    - C:/dev/Portfolio/AI-Marketing/agent/skills-buyer
  # The `skills` toolset is all-or-nothing (skills_list + skill_view +
  # skill_manage) and Hermes has no per-tool denylist, so skill_manage cannot
  # be dropped while keeping skill_view — which the instance needs. Instead,
  # neuter its writes: write_approval STAGES a create/edit/patch/delete for
  # review instead of committing it (it never prompts inline), and nobody
  # approves anything on a buyer instance. Without this, a prompt-injected
  # buyer could persistently rewrite the skill that answers every later
  # buyer — the one genuinely durable compromise this instance is exposed to.
  write_approval: true
  # Scan agent-written skill content too. Cheap here: this instance is never
  # meant to author a skill, so the friction cost is zero.
  guard_agent_created: true
  # Never pre-execute !`cmd` snippets from SKILL.md bodies (already the
  # default; explicit because on a public instance it is a code-exec path).
  inline_shell: false

# Background skill maintenance OFF. It archives unused skills and can fork an
# aux-model pass over them. This profile has exactly ONE skill — an archive
# would silently take the whole instance down, and there is no operator
# watching it.
curator:
  enabled: false

# --- ⚠ BOTH LOCKDOWNS BELOW ARE KEYED BY PLATFORM --------------------------
# `platform_toolsets` and the slash-command gating are keyed BY PLATFORM. They
# now cover `telegram` and `whatsapp` (plus `cli`) - the buyer-channel transport
# decision was settled as BOTH channels, because Facebook-sourced buyers reply
# on Telegram while Yad2/Instagram-sourced buyers reply on WhatsApp.
#
# The rule that produced this shape still stands for any FUTURE platform:
# gating is enabled only by the presence of an admin list, so adding a platform
# without an `extra.allow_admin_from` block silently restores the exact hole
# PR #34 was created to close - every stranger back to admin tier on all ~68
# commands, /profile included, which hands them the operator's outbound
# Listing-mutating skills. Add the gating in the SAME change as the transport.
#
# STILL OPEN, and deliberately so: `whatsapp_cloud` (the official Meta Cloud
# API, which Hermes ships an adapter for) registers as a DISTINCT platform name
# and is covered by NEITHER lockdown below. Its admin id is unknowable until a
# real Cloud sender exists, so writing untested gating for it now would create
# exactly the false sense of safety this note exists to prevent. Tracked as a
# deploy gate in TODO.md.

# --- Tool lockdown, layer 1: per-platform allowlist ------------------------
# _get_platform_tools() uses DIRECT MEMBERSHIP when the saved list contains
# real toolset keys (hermes_cli/tools_config.py) — so this is an allowlist,
# not an addition to a default set. `skills` is the only one the buyer skill
# needs (skill_view). `clarify` is deliberately omitted: the skill asks its
# clarifying questions as plain conversational text, which is what was
# proven via hermes -z.
platform_toolsets:
  telegram:
    - skills
  # WhatsApp needs its OWN entry: without one it falls back to the platform
  # default, which resolves to [clarify, skills] rather than [skills]. Verified
  # by resolving both before and after adding this line - with it, whatsapp and
  # telegram both resolve to the identical 3 tools (skills_list, skill_view,
  # skill_manage) and nothing non-configurable is recovered into it.
  whatsapp:
    - skills
  cli:
    - skills

# --- Tool lockdown, layer 2: global hard suppression -----------------------
# NOT belt-and-braces — load-bearing. Layer 1 is not a complete allowlist:
# _get_platform_tools ends with a "recover non-configurable platform toolsets"
# block that runs in BOTH branches, re-adding toolsets that are part of the
# platform composite but absent from CONFIGURABLE_TOOLSETS. `kanban` reached
# telegram that way despite an explicit [skills] list. This layer is applied
# unconditionally as a final subtraction (model_tools.py _compute_tool_
# definitions) and is what actually removes them.
agent:
  max_turns: 12
  reasoning_effort: medium
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - web
    - computer_use
    - delegation
    - cronjob
    - memory
    - image_gen
    - video_gen
    - video
    # vision is disabled on purpose: enabling it would make a PUBLIC instance
    # process attacker-supplied image files, which is exactly what makes the
    # deferred Pillow CVEs (Phase 3, TODO item 6) reachable. Buyers get a
    # text-only receptionist.
    - vision
    - tts
    - x_search
    - todo
    - session_search
    - context_engine
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    # Not in CONFIGURABLE_TOOLSETS — recovered into telegram by the block
    # described above. A stranger must not be able to read or write the
    # operator's task board.
    - kanban

# --- Slash-command lockdown ------------------------------------------------
# The tool lockdown above does NOT cover gateway slash commands — they are not
# tools. On connect, Hermes registers 68 of them on the bot (/model, /profile,
# /yolo, /update, /restart, /reset, /memory, /skills, …).
#
# gateway/slash_access.py resolves access with `enabled = bool(admin_ids)`, and
# when gating is disabled `can_run()` returns True for EVERY allowed caller.
# With TELEGRAM_ALLOWED_USERS=* that means every stranger had admin-tier access
# to all 68 — including /profile, which would hand them the operator's outbound
# skills. Setting an admin list is what switches gating on at all.
#
# Result: only the operator's Telegram id is admin; everyone else is capped at
# `start` plus the hardcoded floor of /help and /whoami
# (_ALWAYS_ALLOWED_FOR_USERS). See the note on `start` below - it is the one
# entry deliberately added to user_allowed_commands.
platforms:
  telegram:
    extra:
      # MACHINE-SPECIFIC - change per deployment. This is the dev operator's
      # own Telegram user id. Terraform's future per-customer buyer instance
      # ships from this file, and there is no parameterisation yet, so leaving
      # it would grant one personal account admin-tier access to every
      # customer's bot. Tracked as a deploy gate in TODO.md.
      allow_admin_from:
        - "8543293827"          # operator's Telegram user id
      # Strangers get `start` plus the hardcoded floor (help/whoami) and
      # nothing else. `start` is NOT an admin action — it is the button
      # Telegram shows on every new bot chat, and Hermes defines it as
      # "acknowledge platform start pings without a reply", a no-op that
      # creates and exposes nothing. Omitting it meant a real buyer's very
      # first tap returned "⛔ /start is admin-only here" (found 2026-07-26 in
      # a live test). Locking a public surface by allowlist will also catch
      # the platform's own entry points — check them explicitly.
      user_allowed_commands:
        - start
      group_allow_admin_from:
        - "8543293827"
      group_user_allowed_commands:
        - start

  # --- WhatsApp (the Yad2 / Instagram buyer channel) ----------------------
  # Buyers who found the property on Yad2 or Instagram reply on WhatsApp;
  # Facebook-sourced buyers reply on Telegram. Both channels run from this one
  # instance - a Hermes gateway serves multiple platforms simultaneously (the
  # operator profile has done so since 2026-07-22).
  #
  # This runs the UNOFFICIAL Baileys bridge against a dedicated second number,
  # never the operator's and never a personal one: a public bot auto-replying
  # to strangers is the highest ban-exposure surface in the product, and a ban
  # kills that number's WhatsApp outright. The official Cloud API has no ban
  # risk and Hermes ships an adapter for it, but it needs a public HTTPS
  # webhook, so it is blocked behind the Hetzner deploy. See TODO.md.
  whatsapp:
    extra:
      # ⚠ DESTRUCTIVE IF WRONG - do not "tidy" this back to the default.
      # The adapter defaults to bridge_port 3000 and, on gateway start, calls
      # _kill_port_process(bridge_port) to clear orphaned bridges. Port 3000 is
      # the LIVE OPERATOR bridge on the dev laptop. Session dirs are already
      # profile-scoped, so the port is the ONLY thing that collides.
      # (Pairing is safe regardless: `hermes whatsapp` runs bridge.js
      # --pair-only, which explicitly starts no HTTP server.)
      # On a dedicated per-customer buyer box there is no operator bridge to
      # collide with, so this is dev-laptop coexistence, not a production need.
      bridge_port: 3001
      # Strangers must reach the agent directly. dm_policy defaults to
      # "pairing", which would answer a buyer's first message with a pairing
      # prompt they can never complete - the WhatsApp equivalent of the empty-
      # allowlist trap that bit the Telegram spike.
      dm_policy: open
      # Groups OFF - deliberately unlike the Telegram block above. A public
      # WhatsApp number gets added to groups by spammers, and the receptionist
      # has no business participating in one. Telegram's block allows groups
      # because a bot cannot be added to a Telegram group the same way.
      group_policy: disabled
      # MACHINE-SPECIFIC - change per deployment. The dev operator's real
      # WhatsApp identity, read from the operator profile's own state.db, not
      # guessed: WhatsApp identifies senders by LID, not by phone number.
      #
      # The "@lid" suffix is REQUIRED and was resolved, not assumed: against
      # the real policy code, "107186009169928@lid" grants admin while the bare
      # "107186009169928" does not - the slash layer does no normalising, even
      # though the bridge's own allowlist does.
      #
      # Residual: that value is what Hermes RECORDS as the session user_id for
      # real WhatsApp traffic, which is the best evidence available before a
      # live buyer sends a slash command. If the runtime form ever differs, it
      # fails CLOSED - the list's PRESENCE is what switches gating on, so the
      # operator would merely lose admin here (they still have Telegram/CLI)
      # and no stranger gains anything.
      allow_admin_from:
        - "107186009169928@lid"
      group_allow_admin_from:
        - "107186009169928@lid"
      # Empty ON PURPOSE, and not a copy of Telegram's `start`. Telegram needed
      # `start` because it is the button shown in every new bot chat, and
      # omitting it made a real buyer's first tap a permissions refusal.
      # WhatsApp has no such entry point - verified: the WhatsApp adapter
      # registers no commands at all. Strangers therefore get only the
      # hardcoded _ALWAYS_ALLOWED_FOR_USERS floor of /help and /whoami.
      user_allowed_commands: []
      group_user_allowed_commands: []

# --- Memory off ------------------------------------------------------------
# On a public instance, agent memory and the user profile are a poisoning
# vector: a stranger could write durable state that colours later replies to
# other buyers. The buyer skill is stateless by design — every answer comes
# from the injected listings block.
memory:
  memory_enabled: false
  user_profile_enabled: false

# Buyer conversations are long-lived threads keyed per sender; never auto-reset
# (matches the operator profile and the Inquiry-per-session schema).
session_reset:
  mode: none

# --- Plugins ---------------------------------------------------------------
# Copied into this profile's plugins/ dir (plugins are NOT discovered via a
# config pointer the way skills are — see CLAUDE.md).
plugins:
  enabled:
    - buyer-listings-context
    - sync-inquiries-to-webapp

# NOTE: WhatsApp is now a real second buyer channel (block above). The former
# invariant here - "WhatsApp must be ABSENT, never merely disabled, so this
# instance can never contend with the operator profile's paired device" - was
# retired deliberately on 2026-07-28, not forgotten. Its rationale is satisfied
# structurally instead: a SEPARATE number (its own WhatsApp account), a
# SEPARATE session dir (already profile-scoped) and a SEPARATE bridge port. The
# two instances therefore have nothing left to contend over.
#
# What still holds from it: `WHATSAPP_ENABLED=false` does NOT stop Hermes
# attempting a connection, so the WHATSAPP_* vars ship COMMENTED OUT in
# .env.example and are uncommented only once a number is actually paired.

# --- First-contact onboarding note OFF ---------------------------------------
# Hermes injects a note into the very first message ever for a profile telling
# the agent to introduce itself, mention /help, and OFFER to build a profile of
# the person — asking their name/occupation, offering a web_search to confirm
# public details about them, and saving facts with the memory tool. On a public
# buyer instance that is a stranger being asked for personal data and offered a
# background check, and the promise is empty anyway since memory is disabled
# here. It fired on our first real buyer. `off` reduces it to a plain intro.
#
# NOTE: the LIVE config.yaml has no comments — the running gateway rewrites the
# file and strips them. This repo copy is the documented source of truth; stop
# the gateway before editing the live one or the edit is clobbered.
onboarding:
  profile_build: "off"
